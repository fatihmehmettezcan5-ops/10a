name: Android APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName (örn. 1.0.1)"
        default: "1.0.0"
        required: false
      versionCode:
        description: "versionCode (her sürümde +1)"
        default: "4"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Sürüm bilgilerini uygula
        run: |
          VN="${{ github.event.inputs.versionName || '1.0.0' }}"
          VC="${{ github.event.inputs.versionCode || '4' }}"
          sed -i "s/versionCode [0-9]*/versionCode ${VC}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VN}\"/" app/build.gradle
          echo "Sürüm: ${VN} (code ${VC})"

      - name: Derle (assembleRelease)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: İmzala
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/android.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/android.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out 10a-panel.apk app-release-aligned.apk
          "$BT/apksigner" verify 10a-panel.apk
          rm -f /tmp/android.keystore

      - name: APK artefaktı
        uses: actions/upload-artifact@v4
        with:
          name: 10a-panel-apk
          path: android/10a-panel.apk

      - name: GitHub Release (sadece v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/10a-panel.apk
